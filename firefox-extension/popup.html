<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Coach</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #1a1a2e;
      color: #fff;
      width: 320px;
      min-height: 200px;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo svg {
      width: 22px;
      height: 22px;
      color: white;
    }
    
    .title {
      font-size: 18px;
      font-weight: 600;
    }
    
    .subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }
    
    .content {
      padding: 16px;
    }
    
    .analyze-btn {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    
    .analyze-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }
    
    .analyze-btn:active {
      transform: translateY(0);
    }
    
    .analyze-btn svg {
      width: 18px;
      height: 18px;
    }
    
    .analyze-btn.loading {
      opacity: 0.7;
      cursor: wait;
    }
    
    .hotkey-hint {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }
    
    .hotkey {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      margin-left: 4px;
    }
    
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }
    
    .status.success {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }
    
    .status.error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }
    
    .result-preview {
      margin-top: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    
    .result-recommendation {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    
    .result-info {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
    }
    
    .settings {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .settings-title {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .settings-title svg {
      width: 14px;
      height: 14px;
    }
    
    .api-input-group {
      display: flex;
      gap: 8px;
    }
    
    .api-input {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
    }
    
    .api-input:focus {
      outline: none;
      border-color: #22c55e;
    }
    
    .api-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    
    .save-btn {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .save-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .error-log-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .connection-status {
      margin-top: 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .status-dot.connected {
      background: #22c55e;
    }
    
    .status-dot.disconnected {
      background: #ef4444;
    }
    
    .status-dot.checking {
      background: #f59e0b;
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1.4 0 2.8-.3 4-.9-.2-.6-.3-1.3-.3-2-.3-3.6 2.3-6.8 5.8-7.4.3-.7.5-1.5.5-2.3 0-1.1-.2-2.2-.6-3.2C19.6 3.6 16 2 12 2zm-3 9c-.8 0-1.5-.7-1.5-1.5S8.2 8 9 8s1.5.7 1.5 1.5S9.8 11 9 11zm6 0c-.8 0-1.5-.7-1.5-1.5S14.2 8 15 8s1.5.7 1.5 1.5-.7 1.5-1.5 1.5z"/>
      </svg>
    </div>
    <div>
      <div class="title">Poker Coach</div>
      <div class="subtitle">AI Training Assistant</div>
    </div>
  </div>
  
  <div class="content">
    <button id="analyzeBtn" class="analyze-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Analyze Screenshot
    </button>
    
    <div class="hotkey-hint">
      Hotkey: <span class="hotkey">Ctrl+Shift+P</span>
    </div>
    
    <div id="status"></div>
    <div id="result"></div>
    
    <div class="settings">
      <div class="settings-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        API Server
      </div>
      <div class="api-input-group">
        <input type="text" id="apiUrl" class="api-input" placeholder="http://localhost:5000">
        <button id="saveBtn" class="save-btn">Save</button>
      </div>
      <input type="password" id="providerApiKey" class="api-input" placeholder="Your Gemini API key (optional)" style="margin-top: 8px; width: 100%;">
      <p style="font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 6px; line-height: 1.4;">
        Optional: Use your own key for full control over limits and billing.
      </p>
      <div id="connectionStatus" class="connection-status">
        <div class="status-dot checking"></div>
        <span>Checking connection...</span>
      </div>
    </div>
    
    <div class="error-log-section" id="errorLogSection" style="display: none;">
      <div class="settings-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        Error Log
      </div>
      <button id="downloadLogBtn" class="save-btn" style="width: 100%;">
        Download Error Log (<span id="errorCount">0</span> entries)
      </button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
